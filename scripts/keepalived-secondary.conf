vrrp_instance VI_1 {
    state BACKUP
    interface eth0     # TODO: set to your NIC (e.g. ens192, enp3s0)
    virtual_router_id 51
    priority 90
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass CHANGEME   # TODO: set to a shared secret, keep it out of version control
    }

    virtual_ipaddress {
        192.168.1.200/24   # TODO: set to a free IP on the gateway subnet (must not collide with a node IP)
    }

    track_script {
        chk_gateway
    }
}

vrrp_script chk_gateway {
    script "systemctl is-active dvram-gateway"
    interval 2
    weight 20
    fall 3
    rise 2
}
