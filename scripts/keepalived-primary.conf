vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass dvram2026
    }

    virtual_ipaddress {
        192.168.1.100/24
    }

    track_script {
        chk_gateway
    }
}

vrrp_script chk_gateway {
    script "systemctl is-active dvram-gateway"
    interval 2
    weight 20
    fall 3
    rise 2
}
