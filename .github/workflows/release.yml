name: Release

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

  build-matrix:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
            build_gpu_exporter: true
          - goos: linux
            goarch: arm64
            suffix: ''
            build_gpu_exporter: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Generate version
        id: version
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build gateway
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-X plinth/internal/version.Version=${{ steps.version.outputs.version }} \
                             -X plinth/internal/version.Commit=${{ steps.version.outputs.version }} \
                             -X plinth/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o plinth-gateway-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/gateway

      - name: Build gpu-exporter
        if: matrix.build_gpu_exporter
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-X plinth/internal/version.Version=${{ steps.version.outputs.version }} \
                             -X plinth/internal/version.Commit=${{ steps.version.outputs.version }} \
                             -X plinth/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o plinth-gpu-exporter-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/gpu-exporter

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            plinth-gateway-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
            plinth-gpu-exporter-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  build:
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - run: echo "All builds passed"

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.version }} \
            --repo ${{ github.repository }} \
            --title "Release ${{ steps.version.outputs.version }}" \
            --generate-notes \
            artifacts/**/*